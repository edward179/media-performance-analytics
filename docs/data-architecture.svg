<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1900" height="440" fill="#ffffff"/>

  <!-- Section containers -->
  <rect x="15" y="55" width="280" height="345" rx="14" fill="none" stroke="#212529" stroke-width="1.5" stroke-dasharray="6,5"/>
  <rect x="340" y="55" width="800" height="345" rx="14" fill="none" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="6,5"/>
  <rect x="1185" y="55" width="250" height="345" rx="14" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="6,5"/>
  <rect x="1480" y="55" width="380" height="345" rx="14" fill="none" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- Section titles -->
  <text x="155" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#212529">1. Extract — raw CSV</text>
  <text x="740" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#2f9e44">2. Transform — Python (build_data_mart.py)</text>
  <text x="1310" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#e8590c">3. Load</text>
  <text x="1670" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#1971c2">4. Visualize — Looker Studio</text>

  <!-- Extract: raw files -->
  <rect x="45" y="90" width="220" height="50" rx="8" fill="#f8f9fa" stroke="#212529" stroke-width="1.5"/>
  <text x="155" y="111" text-anchor="middle" font-size="13" fill="#212529">user_ltv.csv</text>
  <text x="155" y="128" text-anchor="middle" font-size="11.5" fill="#495057">99 rows · weekly cohort</text>

  <rect x="45" y="170" width="220" height="50" rx="8" fill="#f8f9fa" stroke="#212529" stroke-width="1.5"/>
  <text x="155" y="191" text-anchor="middle" font-size="13" fill="#212529">campaign_meta.csv</text>
  <text x="155" y="208" text-anchor="middle" font-size="11.5" fill="#495057">14 campaigns</text>

  <rect x="45" y="250" width="220" height="50" rx="8" fill="#f8f9fa" stroke="#212529" stroke-width="1.5"/>
  <text x="155" y="271" text-anchor="middle" font-size="13" fill="#212529">media_spend.csv</text>
  <text x="155" y="288" text-anchor="middle" font-size="11.5" fill="#495057">261 rows · daily</text>

  <rect x="45" y="330" width="220" height="50" rx="8" fill="#f8f9fa" stroke="#212529" stroke-width="1.5"/>
  <text x="155" y="351" text-anchor="middle" font-size="13" fill="#212529">user_acquisition.csv</text>
  <text x="155" y="368" text-anchor="middle" font-size="11.5" fill="#495057">261 rows · daily</text>

  <!-- Transform steps -->
  <rect x="370" y="245" width="220" height="60" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="480" y="271" text-anchor="middle" font-size="12.5" fill="#212529">Join spend + acquisition</text>
  <text x="480" y="289" text-anchor="middle" font-size="12.5" fill="#212529">on date + campaign_id</text>

  <rect x="620" y="85" width="230" height="60" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="735" y="111" text-anchor="middle" font-size="12.5" fill="#212529">Aggregate spend &amp; installs weekly</text>
  <text x="735" y="129" text-anchor="middle" font-size="12.5" fill="#212529">(aligned to LTV cohort_week)</text>

  <rect x="880" y="85" width="240" height="60" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="1000" y="111" text-anchor="middle" font-size="12.5" fill="#212529">Compute CAC, CTR, rolling 7-day CAC,</text>
  <text x="1000" y="129" text-anchor="middle" font-size="12.5" fill="#212529">cohort maturity, LTV:CAC</text>

  <rect x="880" y="245" width="240" height="60" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="1000" y="271" text-anchor="middle" font-size="12.5" fill="#212529">Composite health_score →</text>
  <text x="1000" y="289" text-anchor="middle" font-size="12.5" fill="#212529">Scale / Maintain / Optimize / Pause</text>

  <text x="740" y="375" text-anchor="middle" font-size="12" fill="#2f9e44">Output: dim_campaign · fact_daily · fact_weekly_cohort · mart_campaign_summary</text>

  <!-- Load: Google Sheets -->
  <path d="M1265,190 V280 A45,14 0 0 0 1355,280 V190" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.5"/>
  <ellipse cx="1310" cy="190" rx="45" ry="14" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.5"/>
  <path d="M1265,220 A45,14 0 0 0 1355,220 M1265,250 A45,14 0 0 0 1355,250" fill="none" stroke="#e8590c" stroke-width="1.2"/>
  <text x="1310" y="325" text-anchor="middle" font-size="13" fill="#212529">Google Sheets</text>
  <text x="1310" y="343" text-anchor="middle" font-size="12" fill="#495057">4 tabs</text>

  <!-- Visualize: dashboard pages -->
  <text x="1560" y="232" text-anchor="middle" font-size="13" fill="#212529">Looker Studio</text>
  <text x="1560" y="250" text-anchor="middle" font-size="12" fill="#495057">dashboard</text>

  <rect x="1640" y="95" width="200" height="45" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="1740" y="122" text-anchor="middle" font-size="12.5" fill="#212529">Executive Summary</text>
  <rect x="1640" y="165" width="200" height="45" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="1740" y="192" text-anchor="middle" font-size="12.5" fill="#212529">Platform Performance</text>
  <rect x="1640" y="235" width="200" height="45" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="1740" y="262" text-anchor="middle" font-size="12.5" fill="#212529">Campaign Ranking</text>
  <rect x="1640" y="305" width="200" height="45" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="1740" y="332" text-anchor="middle" font-size="12.5" fill="#212529">Budget Allocation</text>

  <!-- Arrows -->
  <g fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M265,115 H618"/>
    <path d="M265,195 H480 V243"/>
    <path d="M265,275 H368"/>
    <path d="M265,355 H480 V307"/>
    <path d="M590,275 H735 V147"/>
    <path d="M850,115 H878"/>
    <path d="M1000,145 V243"/>
    <path d="M1140,237 H1183"/>
    <path d="M1435,237 H1478"/>
    <path d="M1610,237 H1625"/>
  </g>
</svg>
